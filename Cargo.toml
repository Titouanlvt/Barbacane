# Barbacane : un seul workspace — noyau/ (lecture USB isolée, issu d'usbsas) et borne/.
[workspace]
members = [
  "noyau/usbsas-utils",
  "noyau/usbsas-comm",
  "noyau/usbsas-proto",
  "noyau/usbsas-process",
  "noyau/usbsas-sandbox",
  "noyau/usbsas-scsi",
  "noyau/usbsas-mass-storage",
  "noyau/usbsas-fsrw",
  "noyau/usbsas-mock",
  "noyau/usbsas-config",
  "noyau/usbsas-analyzer-server",
  "noyau/usbsas-cmdexec",
  "noyau/usbsas-dev2scsi",
  "noyau/usbsas-files2fs",
  "noyau/usbsas-files2tar",
  "noyau/usbsas-fs2dev",
  "noyau/usbsas-identifier",
  "noyau/usbsas-scsi2files",
  "noyau/usbsas-tar2files",
  "noyau/usbsas-local2files",
  "noyau/usbsas-net",
  "noyau/usbsas-usbdev",
  "noyau/usbsas-usbsas",
  "noyau/usbsas-hid",
  "noyau/usbsas-tools",
  "borne/analyzer",
  "borne/parcours",
  "borne/client",
  "borne/admind",
  "borne/optique",
  "borne/agent",
  "serveur/protocole",
  "serveur/passerelle",
  "serveur/audit",
  "serveur/web"
]
# Copie externe (licence MIT), non membre : ni fmt ni clippy du projet, dépendances de test non résolues
exclude = ["noyau/fscommon"]
default-members = [
  "noyau/usbsas-utils",
  "noyau/usbsas-comm",
  "noyau/usbsas-proto",
  "noyau/usbsas-process",
  "noyau/usbsas-sandbox",
  "noyau/usbsas-scsi",
  "noyau/usbsas-mass-storage",
  "noyau/usbsas-fsrw",
  "noyau/usbsas-config",
  "noyau/usbsas-cmdexec",
  "noyau/usbsas-dev2scsi",
  "noyau/usbsas-files2fs",
  "noyau/usbsas-files2tar",
  "noyau/usbsas-fs2dev",
  "noyau/usbsas-identifier",
  "noyau/usbsas-scsi2files",
  "noyau/usbsas-tar2files",
  "noyau/usbsas-local2files",
  "noyau/usbsas-net",
  "noyau/usbsas-usbdev",
  "noyau/usbsas-usbsas",
  "borne/analyzer",
  "borne/parcours",
  "borne/client",
  "borne/admind",
  "borne/optique",
  "borne/agent",
  "serveur/protocole",
  "serveur/passerelle",
  "serveur/audit",
  "serveur/web"
]
resolver = "3"

[workspace.package]
version = "2.0.2"
edition = "2024"
license = "GPL-3.0"

[profile.release]
overflow-checks = true
strip = true
codegen-units = 1
lto = "fat"
opt-level = 3

# Infos de débogage réduites : l'espace disque des builds de test reste raisonnable.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# Argon2id à 64 Mio (PIN des utilisateurs, serveur/passerelle) : optimisé même en mode test,
# sinon chaque dérivation prend plusieurs secondes et les tests d'anti force brute s'éternisent.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
