[package]
name = "barbacane-admind"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["getrandom"] }
# Borne en ligne : format du jeton d'enrôlement et messages des mises à jour relayées (même
# crate que l'agent et la passerelle ; aucune dépendance nouvelle dans Cargo.lock).
barbacane-protocole = { path = "../../serveur/protocole" }
env_logger = "0.11.11"
getrandom = "0.4.3"
hex = "0.4.3"
jiff = "0.2.38"
libc = "0.2.191"
log = "0.4.34"
minisign-verify = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
toml = "1.2.0"
ureq = { version = "3.5.0", features = ["json"] }
zstd = "0.14.3"
# Effacement des PIN d'utilisateurs relayés (déjà dans Cargo.lock : client).
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
