<style>
html,body{margin:0;width:960px;height:300px;overflow:hidden;background:linear-gradient(180deg,var(--sol-haut),var(--sol-bas))}
svg{position:absolute;left:0;top:0}
.encre{fill:var(--encre)}.encre-f{fill:var(--encre-bas)}.laiton{fill:var(--laiton)}.laiton-c{fill:var(--laiton-clair)}.laiton-f{fill:var(--laiton-fonce)}
.pierre{fill:var(--trait-fort)}.pierre-f{fill:var(--encre-douce)}.creux{fill:var(--surface-creuse)}.analyse{fill:var(--analyse)}.analyse-f{fill:var(--analyse-fonce)}
.lum{fill:var(--lumiere)}
.txt{position:absolute;left:48px;bottom:44px;max-width:420px}
h1{margin:0;font:600 80px/.92 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--encre)}
p{margin:14px 0 0;font:400 14px/20px "Atkinson Hyperlegible",sans-serif;color:var(--encre-douce)}
</style>
<svg width="960" height="300" viewBox="0 0 960 300">
<!-- blocs : encre 200×256 (tour droite, bord droit), trait-fort 160×176 (tour gauche), laiton 120×120 (herse), analyse 40×64 (voyant) ; chaque bloc a sa tranche de 6 px (relief-rempart) en *-fonce/trait-fort
     disposition : deux tours crénelées et une courtine, posées sur le bord bas, la plus haute à droite comme l'emblème vu à −18°
     motif : créneaux au pas-4 (40 px) et barreaux de herse en laiton — le motif littéral de la marque, puisque la v2 est « la barbacane en volume »
     pas : pas-4 40 px, pas-2 16 px, tranche 6 px ; rayons : 0 (pierre taillée), rayon-s pour les barreaux -->
<g>
  <rect class="pierre-f" x="520" y="130" width="160" height="176"/>
  <rect class="pierre" x="520" y="124" width="160" height="176"/>
  <rect class="pierre" x="520" y="84" width="40" height="40"/><rect class="pierre" x="600" y="84" width="40" height="40"/>
  <rect class="lum" x="520" y="124" width="160" height="2"/>
  <rect class="creux" x="680" y="180" width="80" height="120"/>
  <rect class="encre-f" x="760" y="50" width="200" height="256"/>
  <rect class="encre" x="760" y="44" width="200" height="256"/>
  <rect class="encre" x="760" y="4" width="40" height="40"/><rect class="encre" x="840" y="4" width="40" height="40"/><rect class="encre" x="920" y="4" width="40" height="40"/>
  <path class="creux" d="M800 300V196a60 60 0 0 1 120 0v104Z"/>
  <g>
    <rect class="laiton-f" x="800" y="210" width="120" height="14" rx="4"/><rect class="laiton" x="800" y="206" width="120" height="14" rx="4"/>
    <rect class="laiton-f" x="800" y="246" width="120" height="14" rx="4"/><rect class="laiton" x="800" y="242" width="120" height="14" rx="4"/>
    <rect class="laiton" x="826" y="150" width="12" height="150" rx="4"/><rect class="laiton" x="882" y="150" width="12" height="150" rx="4"/>
    <rect class="laiton-c" x="826" y="150" width="4" height="150"/><rect class="laiton-c" x="882" y="150" width="4" height="150"/>
  </g>
  <rect class="analyse-f" x="700" y="230" width="40" height="70"/><rect class="analyse" x="700" y="224" width="40" height="70"/>
</g>
</svg>
<div class="txt"><h1>Barbacane</h1><p>Charte v2 · la borne qui contrôle tout ce qui entre, en relief.</p></div>
