<link rel="stylesheet" href="../demo.css">
<link rel="stylesheet" href="../sprites.css">
<div class="cadre-ecran b-ecran">
<header class="b-bandeau"><svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6 58V12h4v4h4v-4h4v4h4v42ZM12.5 26v10h3V26ZM42 58V16h4v-4h4v4h4v-4h4v46ZM48.5 26v10h3V26ZM22 58V24h20v34ZM27 58V43a5 5 0 0 1 10 0v15Z"/><rect x="27" y="46" width="10" height="2" fill="var(--laiton-clair)"/><rect x="27" y="51" width="10" height="2" fill="var(--laiton-clair)"/></svg><span class="b-bandeau__nom">Barbacane</span><span class="b-bandeau__plus"><span class="b-mono" style="opacity:.8">B-A-01 · Site A</span></span></header>

<ol class="b-etapes" style="margin:16px 64px 0"><li class="fait">Clé insérée</li><li class="fait">Analyse</li><li class="cours" aria-current=step>Résultat</li><li class="">Sortie</li><li class="">Copie</li></ol>
<main style="flex:1;display:grid;gap:22px;align-content:center;padding:0 64px">
  <div class="b-verdict b-verdict--sain" style="padding:16px 24px">
    <div class="b-sprite s-bouclier b-sprite--fin" style="--cote:110px;margin:-16px 0"></div>
    <div><p class="b-verdict__titre" style="font-size:56px;line-height:58px">Clé saine</p><p class="b-verdict__texte">Aucune menace. Les 1 038 fichiers peuvent être copiés.</p></div>
  </div>
  <p style="margin:0;font-size:30px;line-height:38px">Que faire des fichiers ?</p>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
    <button class="b-choix" style="min-height:132px"><span class="b-choix__titre"><svg viewBox="0 0 24 24" class="" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="10" cy="7" r="1"/><circle cx="4" cy="20" r="1"/><path d="M4.7 19.3 19 5"/><path d="m21 3-3 1 2 2Z"/><path d="M9.26 7.68 5 12l2 5"/><path d="m10 14 5 2 3.5-3.5"/><path d="m18 12 1-1 1 1-1 1Z"/></svg> Copier vers une clé</span><span class="b-choix__texte">Sur une clé de sortie enrôlée, effacée puis formatée.</span></button>
    <button class="b-choix" style="min-height:132px"><span class="b-choix__titre"><svg viewBox="0 0 24 24" class="" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2"/></svg> Graver un disque</span><span class="b-choix__texte">Sur un CD ou un DVD vierge.</span></button>
    <button class="b-choix b-choix--danger" style="min-height:132px"><span class="b-choix__titre">Blanchir cette clé</span><span class="b-choix__texte">Effacée entièrement, puis seuls les fichiers sains y sont réécrits.</span></button>
  </div>
  <div style="display:flex;justify-content:flex-start"><button class="b-btn">Arrêter ici</button></div>
</main>
<footer style="display:flex;justify-content:space-between;align-items:center;padding:0 24px;height:44px;font-size:15px;color:var(--encre-douce)"><span>Barbacane 2.0 · station blanche</span><span style="display:flex;gap:24px;align-items:center"><span class="b-etat b-etat--sain" style="--c:var(--sain)">Serveur connecté</span><button class="b-btn b-btn--discret" style="min-height:44px;font-size:15px;padding:0 8px">Administration</button></span></footer>
</div>
