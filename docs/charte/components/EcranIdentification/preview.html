<!-- @dsCard group="Maquettes · borne" height=780 width=1280 page subtitle="v2 en ligne : identifiant et PIN au pavé tactile" -->
<link rel="stylesheet" href="../demo.css">
<link rel="stylesheet" href="../sprites.css">
<div class="cadre-ecran b-ecran">
<header class="b-bandeau"><svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6 58V12h4v4h4v-4h4v4h4v42ZM12.5 26v10h3V26ZM42 58V16h4v-4h4v4h4v-4h4v46ZM48.5 26v10h3V26ZM22 58V24h20v34ZM27 58V43a5 5 0 0 1 10 0v15Z"/><rect x="27" y="46" width="10" height="2" fill="var(--laiton-clair)"/><rect x="27" y="51" width="10" height="2" fill="var(--laiton-clair)"/></svg><span class="b-bandeau__nom">Barbacane</span><span class="b-bandeau__plus"><span class="b-mono" style="opacity:.8">B-A-01 · Site A</span></span></header>

<main style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:0 96px">
  <div style="display:grid;gap:20px">
    <h1 style="margin:0;font:600 48px/52px var(--font-display)">Identifiez-vous</h1>
    <p style="margin:0;font-size:22px;color:var(--encre-douce)">Cette borne enregistre qui analyse quoi.</p>
    <div class="b-champ"><label for="e-id">Identifiant</label><input id="e-id" class="b-saisie" value="t.lelievre"></div>
    <div class="b-champ"><label for="e-pin">Code PIN Barbacane</label><input id="e-pin" class="b-saisie" type="password" value="1234"><span class="b-aide" style="font-size:18px">4 à 8 chiffres. Ce n'est pas votre mot de passe de session.</span></div>
  </div>
  <div class="b-clavier" style="grid-template-columns:repeat(3,88px);justify-content:center;padding:20px">
    <button class="b-touche" style="width:88px;height:64px">1</button><button class="b-touche" style="width:88px;height:64px">2</button><button class="b-touche" style="width:88px;height:64px">3</button><button class="b-touche" style="width:88px;height:64px">4</button><button class="b-touche" style="width:88px;height:64px">5</button><button class="b-touche" style="width:88px;height:64px">6</button><button class="b-touche" style="width:88px;height:64px">7</button><button class="b-touche" style="width:88px;height:64px">8</button><button class="b-touche" style="width:88px;height:64px">9</button>
    <button class="b-touche" style="width:88px;height:64px;font-size:18px">⌫</button><button class="b-touche" style="width:88px;height:64px">0</button><button class="b-touche b-touche--action" style="width:88px;height:64px;font-size:18px">Valider</button>
  </div>
</main>
<footer style="display:flex;justify-content:space-between;align-items:center;padding:0 24px;height:44px;font-size:15px;color:var(--encre-douce)"><span>Barbacane 2.0 · station blanche</span><span style="display:flex;gap:24px;align-items:center"><span class="b-etat b-etat--sain" style="--c:var(--sain)">Serveur connecté</span><button class="b-btn b-btn--discret" style="min-height:44px;font-size:15px;padding:0 8px">Administration</button></span></footer>
</div>
