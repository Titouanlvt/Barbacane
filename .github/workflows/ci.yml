name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck systeme/*.sh systeme/iso/*.sh tests/*.sh tests/*/*.sh borne/update/barbacane-update-*

  garde-fou-proxmox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh, configurer.sh et preinst refusent un hôte Proxmox (/etc/pve)
        run: sudo tests/garde-fou/scripts.sh

  barbacane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: dépendances
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkgconf clang cmake \
            libssl-dev libkrb5-dev libseccomp-dev libudev-dev libusb-1.0-0-dev \
            protobuf-compiler libdbus-1-dev libfuse3-dev clamav-daemon 7zip bubblewrap \
            zip genisoimage gcab msitools qemu-utils dosfstools mtools exfatprogs ntfs-3g fdisk \
            minisign zstd
          # bubblewrap sans setuid sur Ubuntu : autoriser les espaces de noms utilisateur
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: phase 1, transfert clé → clé usbsas (mock) avec EICAR
        run: tests/phase1-mock.sh
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --no-deps --all-targets -p barbacane-client -p barbacane-analyzer -p barbacane-admind -p barbacane-parcours -- -D warnings
      - name: clippy noyau (non strict, comme le CI amont d'usbsas)
        run: cargo clippy --no-deps --all-targets --workspace
      - name: tests (noyau, analyseur, archives, bout en bout mock)
        run: cargo test
      - name: mises à jour signées (préparation → application)
        run: cargo build -p barbacane-admind && tests/maj/maj.sh
      - name: audit
        run: cargo install --locked cargo-audit && cargo audit
