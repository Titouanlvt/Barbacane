# Configuration de barbacane-analyzer (/etc/barbacane/analyzer.toml)

listen = "127.0.0.1:8042"
work_dir = "/var/lib/barbacane/travail/analyse"   # volume chiffré éphémère (barbacane-travail)
clamd_socket = "/run/clamav/clamd.ctl"
yara_rules_dir = "/var/lib/barbacane/yara"
seven_zip = "/usr/bin/7z"
bwrap = "/usr/bin/bwrap"
stage_dir = "/var/lib/barbacane/travail/sortie"      # déclaré dans [[src_local_dirs]] d'usbsas
reports_dir = "/var/lib/barbacane/rapports"
max_reports = 5000

[limits]
max_depth = 5
max_files = 200000              # par fichier racine (ISO d'installation : des dizaines de milliers)
max_total_size = 34359738368     # 32 Go décompressés par fichier racine (espace de travail sur disque)
max_ratio = 100
extract_timeout = 300            # secondes
extract_memory = 2147483648      # 2 Go
password_timeout = 300           # secondes
password_attempts = 3
