# Réglages imposés par Barbacane dans /etc/clamav/clamd.conf (appliqués par le paquet).
# Tout fichier dépassant les limites d'analyse est signalé (donc refusé) plutôt qu'ignoré.
StreamMaxLength 4000M
MaxFileSize 4000M
MaxScanSize 4000M
MaxRecursion 20
MaxFiles 20000
# Temps d'analyse maximal par fichier : 2 min par défaut, trop court pour un fichier sain de 1 Go
# sur une petite machine (signalé « Heuristics.Limits.Exceeded.MaxScanTime », donc refusé).
MaxScanTime 1800000
AlertExceedsMax yes
AlertEncrypted no
LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660
