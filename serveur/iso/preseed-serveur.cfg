# Serveur Barbacane (suite, v2) : installation entièrement automatique, hors ligne.
# Efface le disque interne choisi par choisir-disque.sh. Conception : docs/suite/serveur-iso.md.
d-i keyboard-configuration/xkb-keymap select fr
d-i hw-detect/load_firmware boolean true

# Aucun réseau pendant l'installation (les interfaces sont configurées par configurer-serveur.sh)
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string barbacane-serveur
d-i netcfg/get_domain string
d-i netcfg/hostname string barbacane-serveur
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/security_host string
d-i mirror/country string manual
d-i mirror/http/hostname string
d-i mirror/http/directory string
d-i mirror/http/proxy string

# Comptes : root avec un mot de passe aléatoire (jeté) puis verrouillé ; le compte
# d'administration système est créé par configurer-serveur.sh (mot de passe à changer à la 1re connexion).
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password @HACHE_ROOT@
d-i passwd/make-user boolean false

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean false

# Disque : choisi par partman/early_command, entièrement effacé, puis
#   EFI | /boot (ext4, non chiffré, nodev,nosuid,noexec) | LUKS2 AES-XTS 512 bits → LVM « barbacane »
# Volumes séparés (guide ANSSI : /var, /var/log, /var/log/audit, /home distincts, options restrictives).
# La phrase de passe ci-dessous est TEMPORAIRE (tirée au hasard à chaque construction d'ISO) : fin
# d'installation scelle le disque au TPM, ajoute une clé de secours puis EFFACE cet emplacement.
d-i partman/early_command string sh /cdrom/barbacane/choisir-disque.sh
d-i partman-auto/method string crypto
d-i partman-auto-lvm/new_vg_name string barbacane
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-crypto/cipher string aes
d-i partman-crypto/ivalgorithm string xts-plain64
# partman double la taille en XTS (crypto-base.sh, setup_luks) : 256 → clé XTS de 512 bits = AES-256.
d-i partman-crypto/keysize string 256
d-i partman-crypto/keyhash string sha256
d-i partman-crypto/passphrase password @PHRASE_TEMPORAIRE@
d-i partman-crypto/passphrase-again password @PHRASE_TEMPORAIRE@
d-i partman-crypto/weak_passphrase boolean true
d-i partman-crypto/confirm boolean true
d-i partman-auto/expert_recipe string serveur :: \
    538 538 1075 free $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
    1024 1024 1024 ext4 $defaultignore{ } method{ format } format{ } use_filesystem{ } \
        filesystem{ ext4 } mountpoint{ /boot } options/nodev{ nodev } options/nosuid{ nosuid } options/noexec{ noexec } . \
    4000 4000 8000 ext4 $lvmok{ } lv_name{ racine } method{ format } format{ } use_filesystem{ } \
        filesystem{ ext4 } mountpoint{ / } . \
    2000 3000 8000 ext4 $lvmok{ } lv_name{ var } method{ format } format{ } use_filesystem{ } \
        filesystem{ ext4 } mountpoint{ /var } options/nodev{ nodev } options/nosuid{ nosuid } . \
    1000 1500 4000 ext4 $lvmok{ } lv_name{ journaux } method{ format } format{ } use_filesystem{ } \
        filesystem{ ext4 } mountpoint{ /var/log } options/nodev{ nodev } options/nosuid{ nosuid } options/noexec{ noexec } . \
    500 500 2000 ext4 $lvmok{ } lv_name{ audit } method{ format } format{ } use_filesystem{ } \
        filesystem{ ext4 } mountpoint{ /var/log/audit } options/nodev{ nodev } options/nosuid{ nosuid } options/noexec{ noexec } . \
    200 200 1000 ext4 $lvmok{ } lv_name{ home } method{ format } format{ } use_filesystem{ } \
        filesystem{ ext4 } mountpoint{ /home } options/nodev{ nodev } options/nosuid{ nosuid } options/noexec{ noexec } . \
    2000 6000 -1 ext4 $lvmok{ } lv_name{ donnees } method{ format } format{ } use_filesystem{ } \
        filesystem{ ext4 } mountpoint{ /var/lib/barbacane-serveur } options/nodev{ nodev } options/nosuid{ nosuid } .
d-i partman-auto/choose_recipe select serveur
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Paquets (depuis l'ISO seulement ; aucune tâche, aucun paquet tiré du pool netinst)
tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

# Configuration du serveur (paquets, TPM, pare-feu, services), puis redémarrage
d-i preseed/late_command string sh /cdrom/barbacane/fin-installation-serveur.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
