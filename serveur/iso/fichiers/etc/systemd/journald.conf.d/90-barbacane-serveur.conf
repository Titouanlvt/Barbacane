# Serveur Barbacane : journal persistant (/var/log/journal, volume chiffré séparé), conservé 1 an
# (conception §1, « Conservation »), compressé, plafonné ; jamais transmis sur le réseau.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=2G
MaxRetentionSec=1year
ForwardToSyslog=no
ForwardToWall=no
