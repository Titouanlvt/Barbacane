[package]
name = "barbacane-passerelle"
description = "Passerelle mTLS du serveur Barbacane (suite) : TLS 1.3 seul, bornes authentifiées, CRL fail-closed, enrôlement validé"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Toutes déjà présentes dans Cargo.lock (justification : docs/suite/serveur-socle.md §4).
anyhow = "1.0.104"
# PIN des utilisateurs (Argon2id), déjà utilisée par borne/admind et serveur/web.
argon2 = { version = "0.6.0", features = ["getrandom"] }
barbacane-audit = { path = "../audit" }
barbacane-protocole = { path = "../protocole" }
data-encoding = "2.11.1"
hex = "0.4.3"
# Vérification des .bcu avant acceptation (déjà utilisé par borne/admind).
minisign-verify = "0.3.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = "0.3.55"
x509-parser = { version = "0.18.1", features = ["verify"] }

[dev-dependencies]
# tls12 : seulement pour prouver que la passerelle REFUSE un client TLS 1.2.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.27.0"
barbacane-protocole = { path = "../protocole" }
data-encoding = "2.11.1"
