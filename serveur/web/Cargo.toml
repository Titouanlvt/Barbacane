[package]
name = "barbacane-web"
description = "Interface web d'administration du serveur Barbacane (suite) : TLS 1.3, mTLS administrateur + mot de passe Argon2id, rôles, pages sans JavaScript"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Toutes déjà présentes dans Cargo.lock (justification : docs/suite/serveur-web.md §9).
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["getrandom"] }
barbacane-audit = { path = "../audit" }
barbacane-passerelle = { path = "../passerelle" }
barbacane-protocole = { path = "../protocole" }
form_urlencoded = "1.2.2"
hex = "0.4.3"
httparse = "1.10.1"
# Annuaire LDAPS (docs/suite/serveur-utilisateurs.md §2) : 4 crates nouvelles (ldap3, lber,
# tokio-stream, utf_types), Rust seul, TLS par rustls + ring déjà utilisés.
ldap3 = { version = "0.12.1", default-features = false, features = ["sync", "tls-rustls-ring"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
x509-parser = { version = "0.18.1", features = ["verify"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
time = "0.3.55"
